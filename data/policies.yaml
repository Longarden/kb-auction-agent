# A5 정책·상품 카탈로그 (process.md §T6).
#
# [주의] 이 파일의 모든 항목은 verified: false 다. 현재 조건·금리·한도를 확인하지
#    않았으므로 확인한 척하지 않는다. source_url 은 빈 문자열, checked_date 는
#    null 로 둔다. 확인 절차를 마친 항목만 셋을 함께 채운다.
#
# applicable_to_auction 의 3값 의미:
#   true  : 경락잔금(경매 낙찰자금) 용도로 쓸 수 있음이 확인된 상품
#   false : 경락잔금 용도로 쓸 수 없는 상품(전세자금 등)
#   null  : 경락잔금 용도 허용 여부 미확인 → 카드에 "[확인 필요]" 배지 강제
#
# conditions 키(전부 룰 엔진이 해석한다. 새 키를 넣으면 eligibility.py 가 실패한다):
#   houseless_only, max_annual_income, max_house_price, min_age, max_age,
#   purposes, max_amount, owned_house_max
#
# [주의] 아래 수치는 전부 "예시값"이다. 실제 데모·제출 전에 각 기관 공고를 확인할 것.

